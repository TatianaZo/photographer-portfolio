name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build -- --configuration=github-pages

      - name: SPA fallback (refresh on deep links)
        run: cp dist/photographer-portfolio/browser/index.html dist/photographer-portfolio/browser/404.html

      - name: Disable Jekyll on Pages
        run: touch dist/photographer-portfolio/browser/.nojekyll

      - name: Push static site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/photographer-portfolio/browser
          clean: true
